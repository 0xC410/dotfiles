### Fontes
font_family       Fira Code
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.0
disable_ligatures never

### Tema e Aparência
include Dark_Pastel.conf
background_opacity     0.95
background_blur        10
cursor_shape          block
cursor_beam_thickness 1.5
draw_minimal_borders  yes

### Performance
repaint_delay 8
input_delay   2
sync_to_monitor yes

### Clipboard
copy_on_select yes

### Scrollback
scrollback_lines 10000
scrollback_pager less --RAW-CONTROL-CHARS --quit-if-one-screen

### Abas e Janelas
window_padding_width 8
window_margin_width  5
window_border_width  1
active_tab_font_style bold
focus_follows_mouse yes
enabled_layouts splits, tall, fat, grid

### Design da Barra de Abas ###
tab_bar_style fade
tab_powerline_style angled
tab_bar_background #1e1e2e
active_tab_background #f7768e
active_tab_foreground #1e1e2e
inactive_tab_background #414868
inactive_tab_foreground #c0caf5

### Layout da Janela do SO
remember_window_size  yes
initial_window_width  640
initial_window_height 400

### Atalhos de Produtividade
# --- Atalhos Gerais ---
map ctrl+shift+e edit_config_file
map ctrl+shift+r load_config_file
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- Gerenciamento de Abas (Tabs) ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+l     next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+h    previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map f2 set_tab_title

# --- Gerenciamento de Janelas (Windows/Panes) ---
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current
map ctrl+shift+w close_window
map ctrl+up    move_window up
map ctrl+down  move_window down
map ctrl+left  move_window left
map ctrl+right move_window right

### Terminal Bell
enable_audio_bell no
